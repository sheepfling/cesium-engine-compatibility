[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cesium-engine-compatibility"
version = "0.1.0"
description = "Focused Cesium compatibility workflows and source-route prep"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cesium = "cesium:main"
cesium-bootstrap = "tools.bootstrap_local_dev:main"
cesium-prepare-source-route = "extensions.cesium.tools.prepare_cesium_source_route:main"
cesium-example = "extensions.cesium.tools.cesium_example_workflow:main"
cesium-godot-doctor = "tools.godot_doctor:main"
cesium-godot-bootstrap = "tools.godot_bootstrap:main"
cesium-godot-aggressive-launcher = "tools.godot_aggressive_launcher:main"
cesium-godot-aggressive-linux-launcher = "tools.godot_aggressive_launcher_linux_docker:main"
cesium-host-inventory = "tools.build_cesium_host_inventory:main"
cesium-unreal-linux = "extensions.cesium.tools.unreal_linux_lane:main"
cesium-unreal-linux-docker = "extensions.cesium.tools.unreal_linux_docker:main"
cesium-godot-linux-docker = "extensions.cesium.tools.godot_linux_docker:main"
cesium-godot-example-build = "tools.build_godot_example:main"
cesium-unity-linux-docker = "extensions.cesium.tools.unity_linux_docker:main"
cesium-unity-example-build = "tools.build_unity_example:main"
cesium-engine-matrix = "tools.build_cesium_engine_matrix:main"
cesium-unity-native-matrix = "tools.build_unity_native_matrix:main"
cesium-compatibility-packet = "tools.build_cesium_compatibility_packet:main"
cesium-fork-workpack = "tools.build_cesium_fork_workpack:main"
cesium-visual-proof = "tools.build_cesium_visual_proof:main"
cesium-windows-visual-proof = "tools.build_windows_visual_proof:main"
cesium-windows-visual-proof-run = "tools.run_windows_visual_proof:main"
cesium-unity-visual-proof = "tools.build_unity_visual_proof:main"
cesium-godot-visual-proof = "tools.build_godot_visual_proof:main"
cesium-unreal-visual-proof = "tools.build_unreal_visual_proof:main"
cesium-visual-proof-compare = "tools.compare_cesium_visual_proof:main"
cesium-visual-proof-normalize = "tools.normalize_cesium_visual_proof:main"
cesium-visual-proof-contracts = "tools.validate_visual_proof_contracts:main"
cesium-visual-proof-roots = "tools.validate_visual_proof_roots:main"
cesium-visual-proof-audit = "tools.validate_visual_proof_audit:main"
cesium-visual-proof-check = "tools.validate_visual_proof_audit:main"
cesium-cross-platform-fix-notes = "tools.build_cesium_cross_platform_fix_notes:main"
cesium-planned-routes = "tools.build_cesium_planned_routes:main"
cesium-plugin-lanes = "tools.run_cesium_plugin_lanes:main"
cesium-execution-audit = "tools.build_cesium_execution_audit:main"
cesium-capture-unity-host-report = "tools.capture_unity_host_report:main"
cesium-stage-unity-host-report = "tools.stage_unity_host_report:main"
cesium-export-unity-host-handoff = "tools.export_unity_host_handoff:main"
cesium-import-unity-host-report = "tools.import_unity_host_report:main"

[tool.setuptools.packages.find]
include = ["cesium", "cesium.*", "tools", "tools.*", "extensions", "extensions.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["artifacts", "build", "dist", "external"]
