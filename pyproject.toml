[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cesium-engine-compatibility"
version = "0.1.0"
description = "Focused Cesium compatibility workflows and source-route prep"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cesium = "cesium:main"

[tool.setuptools]
py-modules = ["cesium"]
